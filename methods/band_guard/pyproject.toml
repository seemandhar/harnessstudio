[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hs-band-guard"
version = "1.0.0"
description = "band-guard: saturation-gated rx band reconstruction for pi0_fast_libero (original RoboMetaHarness method rtcfpp-20261101/r1g-p1) as a HarnessStudio v2 method"
requires-python = ">=3.10"
dependencies = ["harnessstudio", "numpy"]

[project.entry-points."harnessstudio.methods"]
band-guard = "hs_band_guard:config"
band-guard-signctrl = "hs_band_guard:config_signctrl"

[tool.hatch.build.targets.wheel]
packages = ["hs_band_guard"]
