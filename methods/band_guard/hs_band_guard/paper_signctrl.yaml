description: "DEVELOPMENT-ONLY sign control of band-guard: at decisions where band-guard's gate fires in this arm's own rollout (rx outside the checkpoint state band and the extra-delta output pinned at its training extreme on that side), shift rx by the same magnitude |s_rx - clip(s_rx)| with a public-coin sign (+1 = band-guard's restoring correction, -1 = the opposite); otherwise bitwise native."
