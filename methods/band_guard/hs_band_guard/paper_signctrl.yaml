disclosures:
  - "CONTROL, not a candidate: an exploratory development probe run by the evaluator with hs eval on init 30-37 dev scenes only (critic C3), for falsifier F3 ((P1 net) - (signctrl net) <= +2 on hard48). The gate is evaluated in its own closed-loop rollout; at each gated decision the correction magnitude |s_rx - clip(s_rx)| is applied with sign coin * (restoring), coin = +1 if the low bit of sha256(sha256(first public states float64 bytes) || decision counter as uint64 LE)[0] is 0 else -1 (public inputs only; no case key, seed or episode index). coin +1 executes exactly band-guard's a'_rx = m_rx + clip(s_rx); coin -1 executes a_rx + (s_rx - clip(s_rx)). Per-decision coin and per-episode coin_plus/coin_minus counts are in the action_op diagnostics."
  - "Original RoboMetaHarness method (run rtcfpp-20261101, proposal r1g-p1 by agent acd380ee23582d182, approved with conditions by critic a8623158c27233d0a); not a port of any paper. Novelty is stated only as: not found in the local knowledge catalog or the 2026-11-01 literature delta."
  - "Algebraically it is a gated AbsoluteActions(clip(s)) on rx: openpi pi0_fast_libero (LeRobotLiberoDataConfig extra_delta_transform=True, openpi 981483d) outputs m = a - s on dims 0-5 and AbsoluteActions (after Unnormalize) adds the decision-time state back. The op replaces s_rx by clip(s_rx, state q01, state q99) in that reconstruction when s_rx is outside the checkpoint's state band AND the policy output over rows[:5] is pinned at its training extreme on that side. It targets an out-of-support artifact of the extra-delta parameterization and transfers only to checkpoints with delta-to-state output reconstruction. The baseline (and the RTCF reference) executes the official openpi output as served; the baseline is not mis-served."
  - "Borrowed ideas only: FAST tokenizer / pi0-FAST (arXiv:2501.09747v1) decode behaviour (an openpi zero-fill decode-failure chunk is a no-op here); deterministic execution authority that bounds/substitutes commands (local catalog card dynaharness_fast_contract; arXiv version not resolved)."
  - "Correction is applied to every row of the 10-row chunk (DC shift on rx); the candidate executes rows[:5] (profile execute_horizon). Only rx (action/state index 3) is touched; ry, rz, position and gripper are bitwise native."
  - "Decision-time state = obs['states'] passed to the action_op (ctx.observe() at decision start, the observation the policy received). No-op (input returned unchanged) when 'states' is absent, has < 6 entries, the chunk is not [H, 7], anything is non-finite, or the chunk is the openpi zero chunk (every row identical, dims 0-5 = actions mean + state, gripper = actions mean, tol 1e-4); the zero-chunk test is inert for the gate (actions mean rx -2.97 lies strictly inside the saturation edges) but is kept per critic C2."
  - "Development evidence (permitted dev scenes only): CPU replay on the identity dev traces init 30-37 (state[d-1] alignment) reproduces the scientist's trigger counts (scripts/replay_dev.py; runs/rtcfpp-20261101/implementation/band-guard/implementation-report.json)."
