substitutions:
  - "Transport: the two decodes are HarnessStudio `logits`-readout requests to the EXT openvla-contrast server (HarnessOpenVLALogitsServer; native vla-eval predict + recording hooks), not two in-process vla.generate(output_scores) calls; the combine runs in the harness (numpy float32) on the rows sent over msgpack (raw float32 bytes, lossless), not on the GPU in torch: same expression and operation order, bitwise equal (scripts/check_parity.py)."
  - "Execution: the combined tokens are executed through the server's bin->action table (bitwise == the server's de-tokenization, EXT R1a), i.e. the server's action post-processing for the selected profile; SIMPLER's euler2axangle / sticky gripper live in the simpler-seeded contract, not in this method."
  - "Action wire (both settings): HS v2 protocol.py:61 and vla-eval predict.py:241 cast actions to float32 (authors: float64). SETTING Addendum 1: disclosed; label effect decided by GPU check B7."
  - "Numerics env (Setting A): primary = the authors' transformers 4.44.2 / torch 2.3.1 / eager attention venv (runs/pcd-port-20261103/venvs/openvla-authors-numerics) if the evaluator's checks pass; fallback = the HS v2 OpenVLA env (transformers 4.40.1 / torch 2.10, eager attention), then 'adapted'. Setting B: the HS v2 OpenVLA env (transformers 4.40.1, torch 2.10.0, SDPA, cuBLASLt 12.6 pin, P-20261103-01). No token-level replication of the authors' decode is claimed (EXT R9c); G9 measures tie sensitivity."
  - "Prompt (Setting B): the checkpoint's native template 'In: What action should the robot take to {instruction}?\\nOut:' (openvla_hs.py:173) in every arm, not the raw instruction; image LANCZOS 224 + jpeg_roundtrip + center_crop (the LIBERO fine-tune protocol), not cv2 INTER_AREA."
  - "Perception (Setting B): the authors' SIMPLER regexes/aliases/class list do not cover LIBERO objects. B uses the service's frozen LIBERO-Goal parser + alias table service/pcd_perception/parsers/libero_goal.json sha256 eb67f16396877052eb17654b5a1fabe3ffa59cfd362dc9ece400981fc31724e8 (loader pin parsers/__init__.py 86d2121d2facc28b261949f893b24720254b109377d8149339015be86980e627; reports/libero_parser.md), built from the public instruction list and frozen before any B episode, selected by perception_parser: libero_goal (entry point pcd-libero-goal). Aliases: robot -> robot manipulator (the authors'), cabinet -> black cabinet, middle drawer -> drawer. Alias evidence: CPU (OSMesa) first frames of init 10-12 only (no policy, episode or Setting B outcome)."
  - "Perception transport: the counterfactual frame comes from the method-local HTTP service (methods/pcd/service; GDINO-base fp32 0.25/0.3, SAM2.1-L camera predictor without re-detection, Big-LaMa every step; CPU parity 18/18 frames bitwise vs the authors' contrast_utils, reports/perception_service.md) as lossless .npy, at the input frame's resolution. The authors' extra generate() on the post-terminal frame (parallel_inference.py:223, output unused) is not called."
  - "Episodes, seeds and success are the benchmark contract's (SIMPLER seeded contract for A, vla-eval LIBERO for B); the method never sees them."
  - "Setting B policy (review M2): checkpoint openvla/openvla-7b-finetuned-libero-goal @ fa5ae1e instead of the paper's base openvla/openvla-7b (31f090d)."
  - "Setting B benchmark (review M2): LIBERO-Goal (vla-eval 0.8.0 LIBERO, tasks 0-9 x init 0-2) instead of SIMPLER Google-robot visual matching; no paper row exists for it."
  - "Setting B horizon (review M2): 300 steps (OpenVLA LIBERO-Goal max steps) instead of the SIMPLER TimeLimits 80 / 113."
  - "Setting B success rule (review M2): vla-eval LIBERO terminate-on-success (the episode ends at the first success) instead of the authors' full-TimeLimit run with any-step success (Table 1) / last-step success (Table 9)."
  - "Setting A env identity (review M2; SETTING.md v2 edit-1 (f), Addendum 1): the vla-eval SIMPLER image sha256:f77449671884afee5c997f2b933d0d2db503debe86961d2f6c378d47276d10fe (SimplerEnv 4ab7178, ManiSkill2_real2sim ef7a4d4) with vla-eval 0.8.0 src mounted and the GPU renderer, instead of the authors' vendored SimplerEnv / ManiSkill2_real2sim at Koorye/PCD 31b027e (= ef7a4d4 plus their edits). reports/simpler_readiness.md section 3: 9 ManiSkill2_real2sim files differ, all authors' additions (info keys, a second visualize camera, non-default light branches, variant envs); no behavioral difference found for Pick Coke Can / Close Drawer / Move Near under prepackaged default lighting; 274/275 tracked data files blob-identical (the differing one is WidowX-only); residual: the real_inpainting overlay PNG bytes cannot be verified against the authors' machine (not in their repo). Status item f_env_identity stays pending until the GPU-rendered obs0 checks."
