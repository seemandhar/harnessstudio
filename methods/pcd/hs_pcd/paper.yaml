name: pcd
version: "1.0"
paper:
  id: "arXiv:2505.13255v6"
  title: "Policy Contrastive Decoding for Robotic Foundation Models (PCD), Wu, Luo, Zhang, Xie, Gao, Song, Shen; ICLR 2026"
  venue: "ICLR 2026"
  versions: "v3-v6 share the method (Eq. 2, Alg. 1, alpha); Table 1 with 300 trials per task from v3 (runs/pcd-port-20261103/reports/pcd_audit.md section 1)"
