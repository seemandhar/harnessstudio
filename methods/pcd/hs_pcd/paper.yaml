  - "v1.0 (2026-11-03, conv-card-d1, P-5 at D1, before any primary episode): Setting A status items filled from reports/gpu_phase1.md and eval/decisions/numerics_env.json; Setting A label = adapted (float32 action wire, HS transport, env identity; SAM2 _C unresolved); numerics = authors' env. Metadata only: no parameter or code changed."
  - "v1.0 (2026-11-03, conv-docs-3, review critic-readiness-3 E5, before any episode): original.reported restated as the published percentages with n = 300 (and Table 9 per-task rows added from pcd_audit.md section 6); the audit-derived integer counts were removed. No parameter or code changed."
  - "v1.0 (2026-11-03, conv-fixes-5, review critic-readiness-1 M-A/M-B, before any episode): Setting A carries the SAM2 _C unresolved item next to its label; the Setting B perception substitution names the frozen libero_goal table (sha256 eb67f163...) and aliases; Setting B coverage and alias-amendment disclosure added. No parameter or code changed."
