requires: {capabilities: [act, chunk, seeded_sampling, isolated_streams, logits_readout]}
# Per step: 2 policy requests (real + counterfactual) and 1 perception /step (+1 /reset per episode). Longest horizon
# any arm runs: libero_10 520 (EXT GPU checks) -> 1040 policy samples; SIMPLER <= 200 (apple drawer), libero_goal 300.
budgets: {policy_calls: 1100, llm_calls: 0, tool_calls: 600, max_tokens: 0}
null: shadow
artifacts: []
operators: []
params:
  alpha: 0.8                 # paper Sec. 4.3 best for OpenVLA; launch script contrast_openvla_inference.sh:5; frozen
  perception_url: "http://127.0.0.1:8141"   # overridden by HS_PCD_PERCEPTION_URL (deployment detail)
  perception_timeout: 600.0
  image_key: null            # null = the first public image (the one OpenVLA reads)
  instruction_source: observation
  parser: service            # the perception service owns the frozen parser / alias table (SIMPLER: the authors')
  tile_dir: null             # HS_PCD_TILE_DIR: the run's artifact directory (never under harnessstudio/)
  tile_every: 10             # plus every first-detection step
  require_tiles: true        # SETTING.md v2 edit 3 (ignored by the tier-1 stub)
  action_dim: 7
  perception_parser: simpler   # service /reset `parser`: simpler (Setting A, the authors' table) | libero_goal (Setting B; entry point pcd-libero-goal)
  token_dim: null            # zero-fallback width = the observed logit width (32064 for OpenVLA, = openvla_contrast.py:9)
original:
  repo: "github.com/Koorye/PCD"
  commit: "31b027ecf2a8b9a4e496aaa9478fb951e3d9270a (no licence: independent re-derivation citing file:line; nothing copied)"
  companion: "github.com/Eres-lcy/PCD @ 00c4ac0301e8ef5b12f268f6bd1c29f90e8b875a (Apache-2.0; its OpenVLA PCD-Mask predict_action is functionally identical; no code taken; ICLR values kept: text_threshold 0.3, GDINO fp32)"
  reported: >-
    Table 1 (v3+), SIMPLER, OpenVLA-7B base, the authors' seeded prepackaged protocol, success at any step, published
    percentages with n = 300 trials per task (2700 per arm for the 9-task average): 9-task average Base 16.8% ->
    PCD-GDINO 25.3%; Pick Coke Can 18.0% -> 45.3%; Close Drawer 47.3% -> 73.3%; Open Drawer 23.3% -> 34.7%;
    Move Near 58.7% -> 59.0%. Table 9 (max-step success, same runs, n = 300 per task): average 15.1% -> 21.9%;
    Pick Coke Can 17.3% -> 39.7%; Close Drawer 47.3% -> 72.7%; Move Near 47.3% -> 41.3%. The paper reports
    percentages only; integer success counts are not author-reported and are not restated here.
    Author note (issue #7): results fluctuate with hardware/library versions/seeds. LIBERO: no OpenVLA row (the
    miniVLA LIBERO-90 5-task table has no code and no stated episode count).
description: "PCD for OpenVLA: per step, the real frame and an object-inpainted counterfactual (GDINO + SAM2 tracking + LaMa service) are decoded greedily as two native logits requests; motion tokens use (1+a)s - a c (a = 0.8), the gripper the real stream; executed through the server's bin table."
disclosures:
  - "Setting B counterfactual coverage (frozen libero_goal table; reports/libero_parser.md sections 2-3): tasks 6 (cream cheese not detected) and 9 (rack not detected) are only PARTIALLY masked; tasks 0 and 3 are whole-cabinet counterfactuals (the drawer prompt masks the entire cabinet, so they contrast against 'no cabinet', not 'no drawer'); tasks 0/2/4 share the cabinet region. The alias-rule amendment (a wrong-object hit counts as a miss; perception/libero_alias_candidates.amendment.txt, 12:50:37Z) was written AFTER observing the cabinet alias land 'middle drawer' on the wine rack and BEFORE the drawer candidate ran (12:53:41Z); it changed one decision (middle drawer -> drawer). Accepted with disclosure by review critic-readiness-1."
  - "Null (shadow): perception, both logits requests and the combine run on the shadow session / the method's own perception session on the native trajectory; the framework executes the native action. Decodes per step: baseline 1, candidate 2, null 3 (2 shadow + 1 native replay); perception per step: candidate 1, null 1. PCD's overhead is reported from the candidate's measured cost only (EXT A1)."
  - "Extra requests advance ctx's decision counter twice per step (CRN seeds shift); the OpenVLA sampler-off path ignores seeds, so no action changes (EXT section 5)."
  - "A failed perception or policy call raises: the episode is invalid (infrastructure), never silently a baseline step. The tier-1 stub is used only on HarnessStudio's synthetic fake benchmark (contract control_mode 'fake')."
  - "Detection failure (empty mask): the service returns cf == real frame and the method still decodes both streams and applies (1+a)s - a s, as the code does; such steps are counted (cf_differs false; G9 measures the tie flips)."
  - "Evidence per step (trace event 'pcd') and per episode (accounting.extra.pcd): perception phase, per-target mask presence/area, first detection, tracker None, cf_differs, contrast skipped (B < 7 rows), stream-A fallback (A < 7 rows), per-dimension changed tokens vs native, non-action-vocabulary selections, top1-top2 gaps of s and of the combined scores, perception latency; tiles real|cf every tile_every steps and at first detection."
tier1: {instruction: "pick coke can", horizon: 12, chunk_len: 6}
changelog:
