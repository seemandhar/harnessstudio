    policy: "openvla/openvla-7b (weights 31f090d, hash-pinned), bf16, greedy, unnorm fractal20220817_data"
    profile: "the simpler-seeded extension's server mode simpler_pcd_authors (raw instruction + token 29871, cv2 INTER_AREA 224, eager attention) at ext2/simpler-seeded 9b2b714 on ext2/openvla-contrast adc271a (pinned worktree commits; P-4); frozen policy JSON eval/policies/policy-simpler-numerics.frozen.json, startup probe 8cd3b024770ffa2e on GPUs 4-7"
