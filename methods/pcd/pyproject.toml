[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hs-pcd"
version = "1.0.0"
description = "PCD (Policy Contrastive Decoding, arXiv:2505.13255) for OpenVLA as a HarnessStudio v2 null:shadow controller on the openvla-contrast logits readout"
requires-python = ">=3.10"
dependencies = ["harnessstudio", "numpy", "pillow"]

[project.entry-points."harnessstudio.methods"]
pcd = "hs_pcd:config"
pcd-libero-goal = "hs_pcd:config_libero_goal"

[tool.hatch.build.targets.wheel]
packages = ["hs_pcd"]
# service/ (perception service, its own venv), scripts/ and tests/ are not part of the wheel.
