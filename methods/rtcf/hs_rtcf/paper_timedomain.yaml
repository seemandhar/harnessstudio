  commit: ""
  reported: "WITHDRAWN v2 claims, Table 1 matched block (500 episodes per suite cell: 10 tasks x 10 initial states x seeds 101-105): PI-FAST baseline Long 61.6 / Spatial 96.4 / Object 97.4 / Goal 90.0 / All 86.4; RTCF 68.6 / 97.4 / 97.8 / 89.8 / 88.4; Frame-NN 63.6 / 95.8 / 96.8 / 88.6 / 86.2; Time-Domain 50.0 / 96.2 / 97.2 / 87.0 / 82.6"
description: "RTCF ablation Time-Domain (w/o spectral correction): same PMA retrieval, clipped lambda0-scaled residual on time-domain motion actions."
tier1: {instruction: "pick up the block and place it in the bowl", horizon: 40, chunk_len: 10}
