name: rtcf-framenn
version: "0.2"
paper: {id: "arXiv:2608.04527v2", title: "Retrieve in Time, Correct in Frequency (RTCF); WITHDRAWN by the authors in v3 (2026-10-28: 'experimental evidence is not yet sufficient')", venue: "arXiv 2026 (withdrawn)"}
categories: {primary: memory_retrieval, secondary: []}
# No code was released: this port implements v2 Eq. 5-11 and Alg. 1 (identical in v1; v3 is a withdrawal notice).
# Every constant the paper does not report is frozen a priori, before any evaluation, and listed below.
fidelity: tf_variant   # ablation of rtcf (component study)
substitutions:
  - "FITTED PART: SigLIP features -> fitted PCA (centering + low-rank truncation) -> l2 -> PCA omitted: raw l2-normalized SigLIP pooled features (1152-d) = full-rank PCA WITHOUT centering. This changes the retrieval GEOMETRY, not only the cost: cosine is not invariant to mean-centering or truncation, so neighbour rankings may differ from the paper's, and uncentred cosines sit in a narrow band (smaller spread of c, larger relative weight of gamma). Centering with a data mean is itself a fit and is not used (critic C1)"
  - "SigLIP checkpoint/pooling/camera not reported -> google/siglip-so400m-patch14-224 @ d04cf29fca7b6374f74d8bea1969314492266b5e (Apache-2.0; model.safetensors sha256 30a00c26a045c84a0bd14adc94278d7f1cc941c8bd67e5fa50f7bed34c34e60d, preprocessor_config.json bec6ca69..., config.json 28c69815...), pooler_output (MAP head), agentview image only, float32 for memory and query alike, local HTTP service (scripts/siglip_service.py). Evidence is mixed: the text says 'frozen SigLIP final-layer features' and 'pretrained visual descriptors' (standalone), while 'no additional GPU resources' / Table 2 'CPU' fit the policy's own tower better (its 'semantic-history' stage is untimed). Lossless PNGs are kept in development traces for a later policy-tower sensitivity analysis"
  - "memory: 'successful trajectories collected with memory seed 7' (initial states and count not reported; possibly overlapping the evaluation states) -> hs prepare on DEVELOPMENT initial states 10-29 (20 per task; a budget decision predeclared in runs/rtcf-20261031/protocol/run-order.md before outcomes; the paper's bank is all seed-7 successes) (bench_ext episode_offset 10 with match_sequential_resets, i.e. the scenes of a stock sequential seed-7 run), native pi0-FAST (collection mode), successes only, frozen and sha256-pinned; evaluation uses initial states 0-9 x seeds 101-105, disjoint (scripts/check_split.py). Every suite uses its own development memory on init states 10-29"
  - "replan cadence not reported -> 5 executed actions per policy call = openpi's LIBERO client protocol (replan_steps=5; memory seed 7, 10 init states x seed 10X and the matching published pi0-FAST baselines point to that client); memory collected at the same cadence (critic B1)"
  - "F_c not reported -> 3 (frequency bands f = 1, 2 of H = 10), frozen a priori"
  - "delta_max not reported (value and units) -> 1.0 in normalized DCT-coefficient units (FAST decodes to normalized coefficients; = 10 token units), scalar, coefficient-wise, frozen a priori. In action units the per-coefficient bound lambda0*delta_max/s_d is 0.087-0.257 (1/s_d = 0.903/0.916/1.431/0.907/2.573/0.874 for d0-d5); clipped_frac is reported per decision"
  - "v_max and gamma not reported -> a priori (2, 0.05); may be replaced ONLY by the critic's fixed development-only leave-one-episode-out rule (scripts/select_pma_params.py: 18 configurations, same-task top-1 objective, ties within 1 pp to (2, 0.05), <= 30 CPU-min, Long development memory only), run after memory collection and frozen into these params before any evaluation episode"
  - "Read offset: read at b* (Eq. as written). u_{i,q} is the chunk the memory policy emitted FROM observation z_{i,q}, so Read(M, b*) already is 'the aligned future chunk'; b*+1 would be the chunk one replan interval later (critic C2). read_offset is configurable for a disclosed sensitivity variant only"
  - "'cannot be decoded -> skip correction': the HF FAST decode and openpi extract_actions silently return an all-zero chunk on failure, so failure is detected explicitly by its exact signature in executable actions: every row identical, gripper == (q01+q99)/2, motion dims == (q01+q99)/2 + state[0:6] (tolerance 1e-4; needs the observation state). A genuinely stationary chunk is not flagged. Failed proposals are counted; a failed memory record, an aligned record past the memory end, a wrong-shape or non-finite chunk all mean 'execute the native chunk' (Alg. 1) (critic B4, audit C3)"
  - "'final action magnitude limit' not reported -> clip corrected motion entries to [-1, 1], only where the residual changed them; effectively a no-op because the robosuite OSC controller clips its inputs to +/-1 anyway"
  - "I_motion not listed -> dims 0-5 (position + axis-angle rotation); gripper dim 6 bitwise unchanged (paper: gripper excluded)"
  - "action records: FAST BPE token strings (decoded coefficients = (code + min_token)/scale with a clamp at min_token) -> integer coefficients round(10 * s_d * DCT(A)) of the full proposed EXECUTABLE chunk. For f > 0 these equal the policy's own token coefficients (checked live by scripts/probe_fast_integrality.py); the DC row is in executable coordinates and is masked by Eq. 10"
  - "N (normalization) not specified -> openpi pi0_fast_libero quantile normalization s_d = 2 / (q99 - q01 + 1e-6) (assets/pi0_fast_libero_norm_stats.json); the state-relative delta transform and every per-dim offset fall into the masked DC term"
  - "policy stack: 'frozen PI-FAST' (checkpoint not named) -> openpi pi0_fast_libero (gs://openpi-assets/checkpoints/pi0_fast_libero) served by HarnessStudio's seeded T1 wrapper over vla-eval's Pi0ModelServer (args of vla-eval configs/model_servers/pi0/libero_fast.yaml), vla-eval LIBERO with quat_no_antipodal: true (openpi/robosuite axis-angle; vla-eval's default flips rx and breaks pi0_fast_libero), num_steps_wait 10, official horizons 220/280/300/520, profile configs/pi0fast-libero-hs.yaml (execute_horizon 5)"
  - "LIMITATION (framework): HarnessStudio logs component diagnostics after a decision's actions ran; an episode that ends mid-chunk (every LIBERO success) cancels that last decision, so each memory misses its final policy call (<= 5 steps at cadence 5). The method already defines pre_diagnostics() and the Preparer prefers 'decision_pre' events, so a future framework extension needs no method change"
  - "Frame-NN and Time-Domain ablation rules are not given -> inferred (rtcf-framenn: argmin over all stored frames of Eq. 5; rtcf-timedomain: same clip/scale on normalized time-domain motion actions, which requires memory coefficients in executable coordinates, as stored; with raw FAST tokens the memory DC would be in model coordinates). Ablations are not run in rtcf-20261031"
requires: {capabilities: [act, chunk]}
