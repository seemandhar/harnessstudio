changelog:
  - "v0.1 (2026-10-31): first port from arXiv v2 equations (no code); constants frozen a priori per runs/rtcf-20261031/port/conversion-plan.md"
  - "v0.2 (2026-11-01): critic plan review (approve-with-corrections) applied: cadence 5, exact decode-failure signature, match_sequential_resets for dev, config/split lint, LOO (v_max, gamma) rule, C1-C3 labels; parity-report follow-ups: Alg. 1 fallback on unusable memory chunks, row-position-independent local_cost, clipped_frac statistics"
  - "v0.3 (2026-11-01): preflight-review fixes: R1 card states failed proposals are counted and still corrected (Alg. 1 behaviour unchanged); R2/R3/R4 summarize.py stopping rule (complete seeds only, matched cases, partial seeds listed), ours-minus-paper CIs, latency/retrieval/b* statistics, shadow label, k<2 scaling; R5 freeze_manifest.py (per-file sha256) + check_split fingerprint/memory checks; R6 LOO asserts a Long-only memory; R7 encoder checks the service's pinned weights sha via /health (new param encoder_weights_sha256); R9 gripper +/-1 and image-path disclosure"
  - "v0.4 (2026-11-01): normalization = z-score (the checkpoint's training normalization; repair/diagnosis.md): s_d = 1/(std+1e-6), zero-chunk center = mean, new param norm_mode (must match the server; off-FAST-grid proposals raise), integrality probe --norm-mode; delta_max now in z-score coefficient units (action-unit bounds recomputed)"
  - "v0.5 (2026-11-01): parameter freeze before S3: LOO selection on the S2 Long memory keeps (v_max, gamma) = (2, 0.05) (all 18 configurations tied within 1 pp); R10 refuses a memory with another or no recorded norm_mode/token_scale; MemoryBank cache keyed by arrays + metadata"
