# rtcf dev: libero_goal task_ids 4, init states 10-29, seed 7. Generated by methods/rtcf/scripts/make_configs.py.
extends: /home/sejain/research/cvpr27/vla-eval-v0.8.0/configs/benchmarks/libero/goal.yaml
server:
  url: "ws://localhost:1"
docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero:latest
  gpus: "7"
  user: host
  env:
    - HOME=/tmp
    - LIBERO_CONFIG_PATH=/etc/libero
    - PYTHONPATH=/hs:/hs/methods/rtcf/bench_ext
  volumes:
    - /home/sejain/research/cvpr27/hs2-gpu/libero_config:/etc/libero:ro
    - /home/sejain/research/cvpr27/RoboMetaHarness-claude/harnessstudio:/hs:ro
output_dir: /tmp/rtcf-vla-eval-unused
benchmarks:
  - benchmark: "hs_rtcf_bench:LIBEROSelect"
    subname: libero_goal
    episodes_per_task: 20
    params:
      suite: libero_goal
      seed: 7
      num_steps_wait: 10
      quat_no_antipodal: true
      episode_offset: 10
      match_sequential_resets: true
      task_ids: [4]
