benchmarks:
  - benchmark: "hs_rtcf_bench:LIBEROSelect"
    subname: libero_10
    episodes_per_task: 10
    params:
      suite: libero_10
      seed: 104
      num_steps_wait: 10
      quat_no_antipodal: true
      episode_offset: 0
      match_sequential_resets: false
      task_ids: [2]
