  MIT, RoboHarness commit 716defc): the ''reverse the accumulated motion, then a stabilisation buffer'' pattern is re-implemented here per executed
  row (exact reversed negated rows instead of -accumulated/N); no code is copied or imported.'
- 'Frozen semantics (C3; hs_prr/planner.py docstring is the normative text; tables generated FROM this package by scripts/replay_table.py): decision-time
  state = public states at the decision (recorded post-step state S[d-1]); route A first-onset-only: onset U = first decision with tilt > 55 deg
  or (after the first executed close->open) states rx > 3.40; fire at U+15 iff still true, otherwise route A is disarmed until a restoration hand-back,
  after which the onset search restarts at hand-back + 30; checkpoint = most recent decision within 65 steps with tilt <= 30 deg, rx <= 3.2705
  (pinned state q99, checked against the norm-stats asset at load) and the fire-time gripper sign. Route B: decision-time EE samples f-60..f (13),
  all produced by native rows (window start strictly after the last hand-back), window start >= 250, range < 0.02 m; checkpoint = most recent
  decision within 100 steps >= 0.03 m from the fire position; every checkpoint lies strictly after the last hand-back. Route A is evaluated before
  route B. Abstaining fires disarm their route until the next hand-back. Max 2 restorations.'
- 'C2 custody window: abstain when any executed gripper-command sign change at a step s in [checkpoint, fire) occurs more than 0.02 m (pre-row
  EE position) from the fire-time EE position; latch = fire-time executed gripper command; a second checkpoint lies strictly after the first hand-back,
  so harness rows are never reversed. C4 horizon guard: abstain if fire + L + 10 + 5 > 460 (>= 60 native steps after hand-back); ctx.execute returning
  0 ends any restoration phase.'
- 'Restoration: reversal of the executed rows [checkpoint, fire) in reverse order with dims 0-5 negated and the latched gripper; correction up
  to 2 decisions (5 steps each; the pose error is checked at each correction-decision start and the phase ends when < 1 cm AND < 5 deg) of per-step
  proportional rows a_pos = clip((p_cp - p)/0.0054), a_rot = clip(log(R_cp R^T)/rot_gain) (world frame), each clipped to [-1, 1]; settle 5 zero-motion
  steps; then native decisions. INTERPRETATION I1 (disclosed): ''proportional rows ... per unit'' is implemented as per-step closed-loop rows
  recomputed from the current public state; tolerance checks at the 5-step decision grid keep hand-backs on the native grid.'
