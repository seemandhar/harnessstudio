[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hs-bcp"
version = "1.0.0"
description = "H1-BCP Boundary Clause Prompt (rtcfpp-20261101 round 8): K1 shadow probe of clause vs surface-control prompts at a public custody boundary, plus the K2 executed-switch modes, for openpi pi0_fast_libero as a HarnessStudio v2 controller method"
requires-python = ">=3.10"
dependencies = ["harnessstudio", "numpy"]

[project.entry-points."harnessstudio.methods"]
bcp = "hs_bcp:config_bcp"
bcp-switch = "hs_bcp:config_bcp_switch"
bcp-switch-dot = "hs_bcp:config_bcp_switch_dot"

[tool.hatch.build.targets.wheel]
packages = ["hs_bcp"]
