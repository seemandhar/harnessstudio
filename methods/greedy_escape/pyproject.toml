[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hs-greedy-escape"
version = "1.0.0"
description = "greedy-escape: native greedy OpenVLA with public stall-triggered SCALE escape windows (RoboMetaHarness scalepp-20261102) as a HarnessStudio v2 controller method"
requires-python = ">=3.10"
dependencies = ["harnessstudio", "numpy", "hs-scale"]

[project.entry-points."harnessstudio.methods"]
greedy-escape = "hs_greedy_escape:config"

[tool.hatch.build.targets.wheel]
packages = ["hs_greedy_escape"]
