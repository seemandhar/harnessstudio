name: scale
version: "1"
paper:
  id: "arXiv:2602.04208"
  title: "SCALE: Self-uncertainty Conditioned Adaptive Looking and Execution for Vision-Language-Action Models"
  venue: "ICML 2026 (spotlight)"
  url: "https://arxiv.org/abs/2602.04208"
# Self-uncertainty from the action-token logits drives two temperatures in one forward pass: per-token
# sampling (tau = T0 * sigmoid(u)) and vision-encoder attention (gamma = kappa ** tanh(s * delta u)).
categories: {primary: uncertainty_compute, secondary: [sampler_guidance, observation_grounding]}
# The decoder is the official code's arithmetic op for op (hs_scale/decoder.py); token-level agreement
# with the official predict_action on the same checkpoint and seed: docs/results/scale.md.
# Not substitutions, but disclosed there: the random stream is one torch generator per (decision, seed)
# from HarnessStudio's common random numbers instead of one global stream per run; image preprocessing and
# the LLM attention kernel are vla-eval's OpenVLA server's (the same for every arm).
fidelity: faithful
substitutions: []
requires: {capabilities: [act, chunk, seeded_sampling, isolated_streams, decoding_hooks]}
# One sample per decision; no LLM or tools.
budgets: {policy_calls: null, llm_calls: 0, tool_calls: 0, max_tokens: 0}
null: derived
artifacts: []
operators: []
original:
  repo: "https://github.com/snumprlab/scale (MIT)"
  commit: "b4ad2a6"
  reported: "OpenVLA on LIBERO, greedy -> SCALE: Spatial 86.2 -> 89.5, Object 86.2 -> 91.0, Goal 77.7 -> 82.3, Long 52.7 -> 63.3"
description: "SCALE: self-uncertainty from the action-token logits sets the per-token sampling temperature and the vision-encoder attention temperature of an autoregressive VLA, in one forward pass, without training or a verifier."
tier1: {instruction: "put both the alphabet soup and the tomato sauce in the basket", horizon: 24, chunk_len: 1}
