- Scripted steps use the robot's own 7-D normalized EE-delta + gripper action space at policy-like magnitude (|a_z| = 0.5
  vs the policy's p5/p95 -0.54/0.514), make no policy call and count against the official 520-step horizon. No extra environment
  steps, resets or simulator queries.
- 'Public inputs: executed action history and obs[''states''] (eef xyz, axis-angle, finger qpos; send_state: true is part
  of the frozen protocol, D3). No object pose, contact flag, reward, success or simulator state.'
- 'D4: triggers and constants were designed in-sample on all 100 development scenes over 4 arms (H1''s exclusions for knob
  twists, placements and blip-split carries remove success exposures). The 0/54 greedy-success exposure holds by construction
  and is not retention evidence. There is no unused development slice; validation (init 15-24) is the first out-of-sample
  test. Constants frozen 2026-11-02 before any gpp episode; no sweep before the Campaign.'
- H2 online rule (H2-RC1) fires at max(c+2, c+lat) where the offline replay used c+lat with the whole-run length; the fire
  set is recomputed with the online rule on the 100 greedy records (tests/test_replay_devmap.py).
- 'H2 2nd fire (frozen interpretation of ''risen >= 2 cm since the first''): the maximum EE z after the 1st primitive ended
  minus the z at the 1st fire >= 2 cm. H1 abort executes the vetoed policy action (the open) as one scripted step. Shams:
  H1 veto-only always runs 12 hold steps (no abort); H2 ascend uses the mirrored stop (realized rise < 1 mm).'
- 'Contact stop (v1.1, G1): under OSC delta control a command from rest ramps up (first realized step about a third of the
  sustained ~6.5 mm/step, sometimes ~0: 16% of 43 near-rest starts > -1 mm on the map), so the 1 mm stop rule is tested from
  move step 2 (free-space descent once moving: 0/209 steps > -1 mm). Each H2/H3 fire logs dz_mm.'
- 'Null (shadow, N1): the controller runs and logs primitives on the native trajectory; native actions execute; its monitors
  see the actions it requested (exact until the first fire).'
- 'New training-free mechanism (bdu; review r3 D1-D4 of proposals-r2-review apply): during a <= 10-step window the executed
  action is the policy''s own action with a_z replaced by +0.15 (lateral, rotation and gripper native; sham: a_x = a_y = 0
  too). One greedy decode every step; no extra policy call (c = 1.0). analytic_control declared; every edited step logged
  (ctx.record bdu phase=edit) and counted (accounting.extra.gpp.bdu_edited_steps).'
- 'Trigger (BDU-RC1, frozen a priori; N = 20 chosen in-sample from the 15/20/25 sensitivity): b_k = a_z < -0.2 AND gripper
  open AND realized dz > -0.5 mm; fire at 20 consecutive b. Window ends on a policy close (executed natively), >= 2.5 cm lateral
  since the fire, or 10 steps; counter reset; <= 4 fires. Exposed greedy successes t1i1, t1i7 (the trigger cannot separate
  a productive press in task 1).'
- 'Frozen counting rule: every executed action feeds the bdu counter; a GE-window step resets it (not evaluated inside GE
  windows); a fire is evaluated only after a step with no active primitive / bdu window / GE window and no pending H2/H3 fire.
  A bdu window decodes greedily; a GE window starting at the same step is consumed by it.'
