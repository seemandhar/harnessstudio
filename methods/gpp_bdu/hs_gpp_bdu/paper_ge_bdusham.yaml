disclosures:
- 'New training-free mechanism (D2): not a SCALE variant. SCALE is decoder-only; gpp overrides gripper commands and inserts
  scripted EE-delta motions computed from public proprio (analytic_control, D1). Every scripted step is logged (ctx.record
