[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hs-vlm-rehome"
version = "1.0.0"
description = "vlm-rehome: VLM-flagged post-boundary home re-entry (original RoboMetaHarness mechanism rtcfpp-20261101/r4p-p1) as a HarnessStudio v2 controller"
requires-python = ">=3.10"
dependencies = ["harnessstudio", "numpy", "pillow"]

[project.entry-points."harnessstudio.methods"]
vlm-rehome = "hs_vlm_rehome:config"
vlm-rehome-tiltgate = "hs_vlm_rehome:config_tiltgate"
vlm-rehome-forced = "hs_vlm_rehome:config_forced"

[tool.hatch.build.targets.wheel]
packages = ["hs_vlm_rehome"]
