[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hs-subtask-sequencer"
version = "2.0.0"
description = "Rule-based subtask sequencing controller (training-free Inner Monologue variant, no LLM)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["harnessstudio", "numpy>=1.24"]

[project.entry-points."harnessstudio.methods"]
subtask-sequencer = "hs_subtask_sequencer:config"

[tool.hatch.build.targets.wheel]
packages = ["hs_subtask_sequencer"]
