[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hs-ttf"
version = "0.1.0"
description = "TTF-VLA (arXiv:2508.19257v3): temporal token fusion of OpenVLA's visual tokens, as a HarnessStudio v2 slot method (draft, needs EXT openvla-vision-token-hook)"
requires-python = ">=3.10"
dependencies = ["harnessstudio", "numpy"]

[project.entry-points."harnessstudio.methods"]
ttf = "hs_ttf:config"
ttf-paper-baseline = "hs_ttf:config_off"
ttf-shadow = "hs_ttf:config_shadow"

[tool.hatch.build.targets.wheel]
packages = ["hs_ttf"]
