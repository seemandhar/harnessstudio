description: "TTF-VLA shadow (compute-matched null): masks, fusion, cache and stored attention computed, stock tokens sent to the projector; training-free temporal token fusion; at non-keyframe steps OpenVLA reuses the previous step's visual token of every patch that is both static (grayscale difference) and outside the previous step's top-k text-to-vision attention."
