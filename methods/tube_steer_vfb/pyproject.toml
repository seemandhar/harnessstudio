[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hs-tube-steer-vfb"
version = "1.0.0"
description = "tube-steer-vfb: tube-steer with a SigLIP visual-retrieval tube for instructions without success memory, for pi0_fast_libero (original RoboMetaHarness method rtcfpp-20261101 round 5 P2) as a HarnessStudio v2 method"
requires-python = ">=3.10"
dependencies = ["harnessstudio", "numpy", "pillow"]

[project.entry-points."harnessstudio.methods"]
tube-steer-vfb = "hs_tube_steer_vfb:config"
tube-steer-vfb-ortho = "hs_tube_steer_vfb:config_ortho"

[tool.hatch.build.targets.wheel]
packages = ["hs_tube_steer_vfb"]
