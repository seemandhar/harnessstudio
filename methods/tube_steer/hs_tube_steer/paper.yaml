  retrieved success chunks -> gated restoring rotation toward the nearest same-instruction success-tube orientation''. Never
  a reproduction or verified SOTA; t8 untouched (no success memory); development evidence stays development evidence (C13).'
- 'Memory (C1, C11): assets/tube_memory.npz (sha256 fcf83383...) and tube_memory.json (00d2e87b...), byte-identical copies
  of the frozen artifact built by runs/rtcfpp-20261101/ideation/scripts-r5-memory/build_tube_memory.py from the 127 SUCCESSFUL
  S2 memory episodes (runs/rtcf-20261031/eval/s2, init 10-29, seed 7, native collection mode; per task t0 19, t1 20, t2 8,
  t3 7, t4 17, t5 15, t6 15, t7 19, t8 0, t9 7; trace hashes in the json): decision-time gripper z-axis per decision, keyed
  by the public instruction. Fixed non-parametric store selected by development success labels at build time (as RTCF''s only_success
  memory); 0 trainable parameters, no fitting. Both hashes are checked at load and a mismatch refuses to start. Never rebuilt
  or extended with init 30-49 content; validation uses the same memory.'
- 'Lookup and gate (C2, C3, pinned to ideation/scripts-r5-memory/dev80_tube.py): exact match of obs[''task_description'']
  to a memory instruction (9 LIBERO-10 instructions hit; t8 abstains = bitwise native). D(q) = min angle (deg) between the
  decision-time gripper z-axis z = R(states[3:6])[:, 2] and same-instruction memory rows q'' in [q-4, q+4] by decision index
  (clamped; a memory shorter than q-4 contributes its last row). Arm at decision q when D(q-1) > 15 and D(q) > 15 and q <=
  39 (step <= 195); re-arming after a disarm follows the same rule (only before step 200). While armed: D <= 7.5 deg disarms;
  step > 300 disarms; otherwise steer.'
- 'Steering (T): u = unit(z x z_ref) (world frame; robosuite 1.4 OSC delta rotation is world-frame, left-multiplied, so a
  positive rotation about u moves z toward z_ref); c = clip(D/15, 0.5, 1.0); every executed row r < 5: a_rot'' = a_rot - (a_rot
  . u) u + c u, then clip to [-1, 1]. A native openpi zero chunk (tol 1e-4) while armed gets rotation c u with the other rotation
  components zeroed (translation/gripper native). Translation (dims 0-2), gripper (dim 6) and rows >= 5 are native; every
  non-steered decision returns the native chunk object (bitwise).'
- 'Scalars (C9, A5.1/A5.6): eps 15 deg and the arming window (decision 39 = step 195) were chosen on a 3x3 grid ({10,15,20}
