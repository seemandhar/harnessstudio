  failure analysis; nothing of RTCF is reused. Novelty is stated only as: not found in the local knowledge catalog or the
  2026-11-01 literature delta.'
- 'Boundary detector (ONE, frozen, domain C2): per decision, g = sign(native row-0 gripper), width = states[6] - states[7]
  of the decision-time state; a native zero chunk neither increments nor resets the run (never a release); g > 0 and width
  > 0.004 m: run += 1; g <= 0: boundary if run >= 4 else run = 0; g > 0 with width <= 0.004 (empty close) neither increments
  nor resets. FIRST boundary only. This is the detector of ideation/scripts-domain/dev_activation.py / tilt_window.py (the
  predeclared activation table, 28 dev80 activated episodes), NOT the strictly-consecutive text variant (25; differs on t3
  i30/i35/i36). Window = the boundary decision and the next 29 decisions (150 env steps at 5 actions per call).'
- 'B geometry: u = R(states[3:6])[:, 2] (Rodrigues, valid for |aa| up to 2 pi, so independent of quat_no_antipodal), tilt
  = angle(u, -e_z), k = normalize(u x -e_z); robosuite 1.4 OSC delta rotation is world-frame and left-multiplied (checked
  on 15763 dev steps, geometry test T1). Active iff boundary found, decision in window, tilt > 55 deg, 8-d finite state, executed
  chunk not a native zero chunk. Per executed row: clip to [-1, 1], remove the negative k-part, add push = min(0.5/rad * (tilt
  - 55 deg), 0.2) about +k, re-clip per component (C7). Deviation (disclosed): if the per-component re-clip made the k-component
  negative, the step-3 vector is instead scaled uniformly into the box (keeps its direction; counted as b_rows_rescaled).
  Singularity (C6): |u x d| < 1e-3 -> previous decision''s k, else the horizontal projection of the EE x-axis.'
- 'Scalars (domain C1, general C1): theta 55 deg, W 150 steps, hold 4 decisions, width 0.004 m, kappa 0.5 per rad, omega_max
