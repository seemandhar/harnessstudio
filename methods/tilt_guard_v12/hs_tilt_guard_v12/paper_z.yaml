- 'New training-free mechanism; not a reproduction of any cited paper. Original RoboMetaHarness method (run rtcfpp-20261101,
  round 1): G = r1g-p1 and Z = r1g-p2 by agent acd380ee23582d182 (runs/rtcfpp-20261101/ideation/r1-general.json sha256 3bcf58eb...,
