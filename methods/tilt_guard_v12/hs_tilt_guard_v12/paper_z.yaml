- 'Order (v1.2): (1) Z detects the openpi zero chunk on the NATIVE chunk and, if it substitutes, executes the previous decision''s
  rows 5-9 with the latched gripper (last executed gripper command; the zero chunk''s own gripper value if none was executed
  yet); cap 2 consecutive substitutions: run 1 tail (hold when no valid tail), run 2 hold (zero delta on dims 0-5 + latched
