# RoboHarness development memory pass (paper: "preliminary inference pass over standard LIBERO-Object and
# LIBERO-Spatial"; released code logs 10 episodes per task). Shard spatial_a of 4; hs prepare overrides server.url.
extends: /home/sejain/research/cvpr27/vla-eval-v0.8.0/configs/benchmarks/libero/spatial.yaml
server:
  url: "ws://localhost:1"
docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero:latest
  gpus: "4"
  user: host
  env:
    - HOME=/tmp
    - LIBERO_CONFIG_PATH=/etc/libero
  volumes:
    - /home/sejain/research/cvpr27/hs2-gpu/libero_config:/etc/libero:ro
output_dir: /home/sejain/research/cvpr27/hs2-gpu/roboharness/results/unused
benchmarks:
  - benchmark: "vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark"
    subname: libero_spatial
    episodes_per_task: 10
    tasks:
      - "pick up the black bowl between the plate and the ramekin and place it on the plate"
      - "pick up the black bowl next to the ramekin and place it on the plate"
      - "pick up the black bowl from table center and place it on the plate"
      - "pick up the black bowl on the cookie box and place it on the plate"
      - "pick up the black bowl in the top drawer of the wooden cabinet and place it on the plate"
    params:
      suite: libero_spatial
      seed: 7
      num_steps_wait: 10
