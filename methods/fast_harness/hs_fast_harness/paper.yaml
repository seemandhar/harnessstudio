name: fast-harness
version: "1"
paper: {id: "arXiv:2610.31427", title: "Experience-Driven Review Scheduling for Vision-Language-Action Policies", venue: "preprint (fastharness.github.io)"}
categories: {primary: uncertainty_compute, secondary: [agentic_orchestration, execution_monitoring, memory_retrieval, experience_evolution]}
fidelity: adapted
substitutions:
  - "gpt-6.1-sol (OpenAI chat completions, strict json_schema output) replaces the paper's GPT-6 Astra reviewer (Astra models are not permitted in this workspace)"
  - "cross-episode experience is built by hs prepare on development episodes and frozen; evaluated episodes never update it (the paper accumulates across the evaluated episodes themselves)"
  - "the unreleased RoboDojo runtime is re-derived from the public X5A URDF: numpy forward kinematics for current_eef / student_eef_trajectory and damped-least-squares IK with joint interpolation for edit / eef takeovers"
  - "reviewer protocol: request_id is bound by the harness instead of echoed by the model, no terminal audit review (HarnessStudio never shows the terminal observation), compact request JSON"
  - "reviewer failures (transport or schema retries exhausted) execute the fresh student prefix unreviewed and force the next review, instead of aborting the episode"
  - "proposals' gripper command is clipped to [0, 1] by the controller (RoboDojo clips it anyway); audit sampling uses a constant RNG seed 0; experience is namespaced by instruction+model+config"
  - "development smoke tests (60 steps, no success signal) ran on the stage A held-out layout (seed 0) before the scored runs; the max_completion_tokens operator shim and stage A warm ran after a core change, so stage A arms have two method fingerprints"
requires: {capabilities: [act, chunk]}
budgets: {policy_calls: 1200, llm_calls: 250, tool_calls: 0, max_tokens: 8000}
null: shadow
artifacts: []
operators:
  # gpt-6.1-sol accepts only temperature 1 and max_completion_tokens (see the controller's operator shim and
  # core request 1 in docs/results/fast_harness.md). The response_format is the reviewer's strict Review schema
  # (hs_fast_harness.reviewer.RESPONSE_FORMAT; the controller refuses to run if they differ).
  - {name: reviewer, model: gpt-6.1-sol, base_url: openai, api_key_env: OPENAI_API_KEY, original_model: gpt-6-astra,
     temperature: 1.0, extra_body: {response_format: {"type": "json_schema", "json_schema": {"name": "robot_review", "strict": true, "schema": {"type": "object", "properties": {"stage": {"type": "string", "pattern": "^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$"}, "last_outcome": {"type": "string", "enum": ["ok", "error", "unknown"]}, "error_type": {"type": "string"}, "evidence": {"type": "string"}, "response": {"type": "object", "properties": {"mode": {"type": "string", "enum": ["student", "edit", "eef"]}, "steps": {"type": "integer", "minimum": 1, "maximum": 15}, "reason": {"type": "string"}, "edit": {"type": "object", "properties": {"left": {"type": "object", "properties": {"delta_position": {"type": "array", "items": {"type": "number"}, "minItems": 3, "maxItems": 3}, "delta_rotation_vector": {"type": "array", "items": {"type": "number"}, "minItems": 3, "maxItems": 3}, "gripper": {"type": "string", "enum": ["keep", "open", "closed"]}}, "required": ["delta_position", "delta_rotation_vector", "gripper"], "additionalProperties": false}, "right": {"type": "object", "properties": {"delta_position": {"type": "array", "items": {"type": "number"}, "minItems": 3, "maxItems": 3}, "delta_rotation_vector": {"type": "array", "items": {"type": "number"}, "minItems": 3, "maxItems": 3}, "gripper": {"type": "string", "enum": ["keep", "open", "closed"]}}, "required": ["delta_position", "delta_rotation_vector", "gripper"], "additionalProperties": false}}, "required": ["left", "right"], "additionalProperties": false}, "target": {"type": "object", "properties": {"left": {"type": "object", "properties": {"position": {"type": "array", "items": {"type": "number"}, "minItems": 3, "maxItems": 3}, "quaternion_wxyz": {"type": "array", "items": {"type": "number"}, "minItems": 4, "maxItems": 4}, "gripper_closed": {"type": "boolean"}}, "required": ["position", "quaternion_wxyz", "gripper_closed"], "additionalProperties": false}, "right": {"type": "object", "properties": {"position": {"type": "array", "items": {"type": "number"}, "minItems": 3, "maxItems": 3}, "quaternion_wxyz": {"type": "array", "items": {"type": "number"}, "minItems": 4, "maxItems": 4}, "gripper_closed": {"type": "boolean"}}, "required": ["position", "quaternion_wxyz", "gripper_closed"], "additionalProperties": false}}, "required": ["left", "right"], "additionalProperties": false}, "assessment": {"type": "object", "properties": {"task_progress": {"type": "object", "properties": {"verified_completed": {"type": "array", "items": {"type": "string"}}, "currently_attempting": {"type": "string"}, "remaining": {"type": "array", "items": {"type": "string"}}}, "required": ["verified_completed", "currently_attempting", "remaining"], "additionalProperties": false}, "current_subgoal": {"type": "string"}, "execution_status": {"type": "string", "enum": ["not_started", "progressing", "failed", "uncertain", "recovered"]}, "execution_evidence": {"type": "string"}, "expected_next_intent": {"type": "string"}, "predicted_next_intent": {"type": "string"}, "intent_status": {"type": "string", "enum": ["aligned", "misaligned", "uncertain"]}, "intent_evidence": {"type": "string"}}, "required": ["task_progress", "current_subgoal", "execution_status", "execution_evidence", "expected_next_intent", "predicted_next_intent", "intent_status", "intent_evidence"], "additionalProperties": false}}, "required": ["mode", "steps", "reason", "edit", "target", "assessment"], "additionalProperties": false}, "checkpoint": {"anyOf": [{"type": "object", "properties": {"goal": {"type": "string"}, "prerequisites": {"type": "array", "items": {"type": "string"}}}, "required": ["goal", "prerequisites"], "additionalProperties": false}, {"type": "null"}]}, "recovery_status": {"type": "string", "enum": ["continue", "succeeded", "failed"]}, "selected_checkpoint_id": {"anyOf": [{"type": "string"}, {"type": "null"}]}}, "required": ["stage", "last_outcome", "error_type", "evidence", "response", "checkpoint", "recovery_status", "selected_checkpoint_id"], "additionalProperties": false}}}}}
original: {repo: "https://github.com/FastHarness/fast-harness", commit: "dfe070f", license: MIT,
           reported: "RoboDojo (Isaac Sim), pi0.5 + GPT-6 Astra reviewer, 4 tasks: reviewer tokens -57.2% per task (first episode vs mean of last five), episode time 85.5 -> 52.0 min, success 80% (GPT-as-policy baseline) -> 97.19%; README warm-vs-cold tokens: build tower -67%, stack bowls -74%, fold clothes -65%, bottles -64%"}
description: "A frozen policy proposes every chunk; an LLM reviewer judges it only when the experience-driven scheduler asks (unfamiliar stage, contact, error memory, step cap, audit); errors enter bounded recovery."
tier1: {instruction: "Build a tower using the wooden blocks and wooden boards.", horizon: 24, chunk_len: 6}
