disclosures:
- 'New training-free mechanism; not a reproduction of any cited paper. Original RoboMetaHarness method (run rtcfpp-20261101,
  round-4 CONTROL proposal r4c-p1-redecode, runs/rtcfpp-20261101/ideation/r4-control.json; review runs/rtcfpp-20261101/reviews/r4-proposal-review.json
  C-R1..C-R11; amendment A4 of campaign-inputs/preregistration-r1.md). Composition of known parts: observation-perturbation
  diversity (CycleVLA arXiv 2601.02295v2 / 2610.19438v1 / A3 2605.11567v4 use it for consensus at every decision; here it
  is a decode-repair device used only when the greedy decode provably failed) and the frozen tilt-guard v1.2 Z (and B) rules.'
- 'Trigger: the NATIVE chunk (one seeded call, no override = the baseline''s call) is the openpi zero chunk for the decision-time
  state (all rows identical, dims 0-5 = actions mean + s, gripper = actions mean, tol 1e-4). Retries: obs override {''states'':
  s + delta} then {''states'': s - delta}, delta_i = (std_i + 1e-6) * 2/256 on all 8 state dims (one z-score state-token bin,
  openpi tokenizer.py L70; std from the pinned norm stats sha256 4ece6c43...). A retry is valid iff its raw output is NOT
  the zero chunk for the state actually sent (C-R1). The number of the 8 state tokens a shift changes is logged per retry
  (public replica of the openpi digitize); a retry with no token change is still executed (it deterministically repeats the
  failure; frozen, no skip rule).'
- 'Re-base (C-R3, a convention, not a correction): openpi AbsoluteActions adds back the overridden state; the first valid
  retry is executed with dims 0-5 minus (s_sent - s)[:6], so the command references the true state. The difference from the
  uncorrected output is exactly one state-token bin per dim: (std + 1e-6) * 2/256 = 0.00082/0.00119/0.00296/0.00269/0.00709/0.00254
  for x/y/z/rx/ry/rz (gripper dims 0.00011; <= 0.0071 action units, <= 0.8% of the action std, largest on ry). The gripper
  is executed as decoded. Under m = a - s training the uncorrected output is arguably the model-consistent command; this is
  disclosed, frozen and unit-tested (tolerance 1e-5).'
- 'Fallback and reuse (C-R9): the selected chunk (re-based valid retry, else the native zero chunk) passes through the FROZEN
  hs_tilt_guard_v12 TiltGuardV12ActionOp (imported read-only, params copied from the frozen v1.2 card) with zero=''substitute''
  (tail, then hold, cap 2) and envelope off (''redecode'') or bte (''redecode-b''). With all retries failing the executed
  rows equal v1.2 ''z'' / ''bz'' bitwise; with no zero chunk they equal identity / v1.2 ''b'' bitwise. A successful retry
  is not a zero chunk for the op, so Z does not fire and B''s boundary detector counts it as an ordinary policy decision;
  B may therefore arm differently than in v1.2 ''bz''.'
- 'Seeds (C-R4): each retry advances the framework decision counter, so later native calls use other CRN seeds than identity/Z;
  pi0-FAST decodes greedily (temperature 0), so this is harmless only if the served chunk is seed-invariant, which the evaluator''s
  tier-2 check must show on the live server (same obs, two seeds -> bitwise identical chunk at a zero-chunk state and at a
  normal state) together with a bitwise R-vs-identity action prefix up to the first zero chunk. The framework logs every call''s
  seeds (''sample'' events); the method never reads them.'
- 'Null: shadow (the controller runs in the null arm, pays its retries on the shadow policy session and logs W1 evidence;
  executed actions are native). Budget: policy_calls 312 = 3 x 104 native decisions at horizon 520 (worst case: every decision
  a zero chunk with two retries); expected ratio about 1.03 (dev80 1.9 zero chunks per episode), worst dev episode 1.25 (t8
