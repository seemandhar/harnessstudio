[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hs-redecode"
version = "1.0.0"
description = "ReDecode: fresh decode on openpi FAST decode failures via a one-bin public-state shift, with tilt-guard v1.2 Z (and B) fallback, for pi0_fast_libero (original RoboMetaHarness method rtcfpp-20261101 round 4) as a HarnessStudio v2 controller method"
requires-python = ">=3.10"
dependencies = ["harnessstudio", "numpy", "hs-tilt-guard-v12==1.2.0"]

[project.entry-points."harnessstudio.methods"]
redecode = "hs_redecode:config_redecode"
redecode-b = "hs_redecode:config_redecode_b"

[tool.hatch.build.targets.wheel]
packages = ["hs_redecode"]
