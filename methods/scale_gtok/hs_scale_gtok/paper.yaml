  id: "rmh:scalepp-20261102/scale-gtok"
  title: "SCALE with a deterministic mode-of-bins rule for the gripper token (argmax for action token 7; everything else SCALE) - RoboMetaHarness tf_variant of SCALE (arXiv:2602.04208v2), not a paper port"
  venue: "none (internal; run scalepp-20261102)"
  base_paper: "arXiv:2602.04208v2"
  url: "https://arxiv.org/abs/2602.04208"
# One candidate found independently by both round-1 scientists: GENERAL scale-gtok (ideation/idea-r1g.json) =
# DOMAIN r1d-h1-gripmode-scale (ideation/idea-r1d.json, alias). Approved with required changes RC1-RC6 by
# runs/scalepp-20261102/reviews/proposals-r1-review.json (DECISION_FIRST_scale_gtok).
categories: {primary: sampler_guidance, secondary: [uncertainty_compute, contact_feedback]}
fidelity: tf_variant
substitutions:
  - "SCALE Eq. 4-5 multinomial sampling of the 7th action token (gripper) -> masked argmax over the 256 action bins of the SAME logits (SCALE's own tau<1e-3 branch). The logits come from SCALE's forward pass (gamma-tempered vision attention, sampled motion-token prefix). Tokens 1-6, u_1..u_7, reported tau, gamma and the EMA state are unchanged."
requires: {capabilities: [act, chunk, seeded_sampling, isolated_streams, decoding_hooks]}
# K = 1: one sample per decision (hs_scale:SingleSample), the same forward pass as SCALE minus one multinomial.
budgets: {policy_calls: null, llm_calls: 0, tool_calls: 0, max_tokens: 0}
null: derived
artifacts: []
