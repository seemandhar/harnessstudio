[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hs-scale-gtok"
version = "1.0.0"
description = "scale-gtok: SCALE (arXiv:2602.04208v2) with masked argmax on the gripper token (RoboMetaHarness scalepp-20261102 tf_variant) as a HarnessStudio v2 method"
requires-python = ">=3.10"
dependencies = ["harnessstudio", "hs-scale", "numpy"]

[project.entry-points."harnessstudio.methods"]
scale-gtok = "hs_scale_gtok:config"

[tool.hatch.build.targets.wheel]
packages = ["hs_scale_gtok"]
