[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hs-fork30"
version = "1.0.0"
description = "fork30: greedy OpenVLA with a repeat-cue-gated permanent switch to SCALE at decision 30 (RoboMetaHarness scalepp-20261102 round 4), HarnessStudio v2 controller"
requires-python = ">=3.10"
dependencies = ["harnessstudio", "numpy", "hs-scale"]

[project.entry-points."harnessstudio.methods"]
fork30 = "hs_fork30:config"

[tool.hatch.build.targets.wheel]
packages = ["hs_fork30"]
