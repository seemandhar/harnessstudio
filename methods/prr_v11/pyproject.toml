[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hs-prr-v11"
version = "1.1.0"
description = "PRR 1.1.0: the single permitted C7 technical revision of hs-prr (correction phase only) for pi0_fast_libero, rtcfpp-20261101 round-6 RECOVERY P1, as a HarnessStudio v2 method"
requires-python = ">=3.10"
dependencies = ["harnessstudio", "numpy"]

[project.entry-points."harnessstudio.methods"]
prr-v11 = "hs_prr_v11:config"
prr-v11-hold = "hs_prr_v11:config_hold"
prr-v11-ortho = "hs_prr_v11:config_ortho"

[tool.hatch.build.targets.wheel]
packages = ["hs_prr_v11"]
