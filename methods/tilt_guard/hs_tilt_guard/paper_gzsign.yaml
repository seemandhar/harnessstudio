  failure analysis; nothing of RTCF is reused. Novelty is stated only as: not found in the local knowledge catalog or the
  2026-11-01 literature delta.'
- 'Order (domain C8): (1) Z detects the openpi zero chunk on the NATIVE chunk and, if it substitutes, executes the previous
  decision''s post-G (pre-B) rows 5-9 with the latched gripper (last executed gripper command; the zero chunk''s own gripper
  value if none was executed yet); no re-guarding; cap (general C4) at 2 consecutive substitutions: run 1 tail (hold when
  no valid tail), run 2 hold (zero delta on dims 0-5 + latched gripper), run >= 3 native passthrough. (2) G = hs_band_guard
  BandGuardActionOp (imported read-only, frozen band-guard v1.0 params copied into guard_params) on every non-substituted
  chunk. (3) B last, on rows[:5] of whatever executes, never on an executed native zero chunk. G and B never touch translation
  (dims 0-2) or the gripper (dim 6). Rows 5-9 of the returned chunk are left as produced by (1)-(2); the candidate executes
  rows[:5] (profile execute_horizon 5).'
- 'Boundary detector (ONE, frozen, domain C2): per decision, g = sign(native row-0 gripper), width = states[6] - states[7]
  of the decision-time state; a native zero chunk neither increments nor resets the run (never a release); g > 0 and width
  > 0.004 m: run += 1; g <= 0: boundary if run >= 4 else run = 0; g > 0 with width <= 0.004 (empty close) neither increments
