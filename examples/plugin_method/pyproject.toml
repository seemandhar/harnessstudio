[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hs-first-sample"
version = "1.0.0"
description = "Minimal example method: draw two seeded samples, execute the first."
requires-python = ">=3.10"
dependencies = ["harnessstudio"]

[project.entry-points."harnessstudio.methods"]
first-sample = "hs_first_sample:config"

[tool.hatch.build.targets.wheel]
packages = ["hs_first_sample"]
