# harnessstudio.policies.robodojo_pi05_hs (HarnessPolicyMixin over vla-eval's RoboDojo pi0.5 server, released
# RoboDojo-sim-arx_x5-joint-0/59999 checkpoint, config pi05_base_aloha_full_sim_arx-x5_seed_0): seeded,
