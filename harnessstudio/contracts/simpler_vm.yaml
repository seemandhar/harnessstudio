# EXT openvla-residual-hook: SimplerEnv official grids (visual matching + VA base scenes) with proprioception.
# Benchmark: harnessstudio.benchmarks.simpler_vm:SimplerVMBenchmark (one case per official configuration; task name =
# google_robot_<grid>, task_id = vm<index>/va<index>, episode_idx 0).
# Observation (vla-eval SimplerEnvBenchmark.make_obs, send_state=True): images = {primary: overhead_camera RGB uint8},
#   task_description = env.get_language_instruction() (re-read every step; Place in Drawer switches after step 101),
#   states = agent.eef_pos [pos3 in the robot-base frame, quat_wxyz4, gripper1]; base_pose / tcp_pose / task_name are
#   sent too but are not public. A residual-hook server reads only `states` (HOOK_READABLE); OpenVLA reads none of it.
# Action: RAW OpenVLA [x, y, z, roll, pitch, yaw, open_gripper]; the benchmark applies euler2axangle and the Google
#   relative 15-step sticky gripper. Horizons = official TimeLimits (max_episode_steps of the official scripts); no
#   early stop. Eval configs must not set max_steps (the episode result carries horizon_ok).
name: simpler_vm
public_keys: [images, task_description, states]
optional_keys: [states]
instruction_key: task_description
image_key: images
state_key: states
action_dim: 7
control_mode: eef_delta
horizons:
  google_robot_vm_pick_coke_can: 80
  google_robot_vm_move_near_v0: 80
  google_robot_vm_open_drawer: 113
  google_robot_vm_place_in_drawer: 200
  google_robot_va_open_drawer: 113
  google_robot_va_close_drawer: 113
  google_robot_va_place_in_drawer: 200
  google_robot_va_move_near: 80
  google_robot_va_pick_coke_can: 80
default_horizon: 80          # review critic-ext-1 R13b: never a 200-step default for an unknown task name
eef_position: {path: [states], slice: [0, 3]}
action_layout: {position: [0, 3], rotation: [3, 6], gripper: [6, 7]}
gripper_open: 1.0
gripper_close: 0.0
