[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "harnessstudio"
version = "2.0.0.dev0"
description = "Training-free harnesses around frozen robot policies, as installable methods on allenai vla-eval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["vla-eval==0.8.0", "numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hs = "harnessstudio.cli:main"

[project.entry-points."harnessstudio.methods"]
identity = "harnessstudio.methods.identity:config"

[tool.hatch.build.targets.wheel]
packages = ["harnessstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
